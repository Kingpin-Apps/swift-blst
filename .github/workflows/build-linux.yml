name: Build Linux CBlst bundle

# Builds libblst.a for Linux x86_64 + aarch64, assembles them into a single
# CBlst.artifactbundle, verifies it links via `swift test`, and commits the bundle
# back to the branch this runs on. Run manually after bumping the pinned blst commit
# in scripts/build-linux.sh, or whenever the Linux binary needs refreshing.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build libblst.a (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build the artifact bundle for ${{ matrix.arch }}
        run: bash scripts/build-linux.sh --arch ${{ matrix.arch }}
      - name: Upload per-arch bundle
        uses: actions/upload-artifact@v4
        with:
          name: cblst-${{ matrix.arch }}
          path: CBlst.artifactbundle
          if-no-files-found: error

  assemble:
    name: Assemble, verify, and commit
    needs: build
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Download x86_64 bundle
        uses: actions/download-artifact@v4
        with:
          name: cblst-x86_64
          path: staging/x86_64
      - name: Download aarch64 bundle
        uses: actions/download-artifact@v4
        with:
          name: cblst-aarch64
          path: staging/aarch64
      - name: Merge per-arch outputs
        run: |
          rm -rf CBlst.artifactbundle
          mkdir -p CBlst.artifactbundle/CBlst
          cp -R staging/x86_64/CBlst/. CBlst.artifactbundle/CBlst/
          cp -R staging/aarch64/CBlst/. CBlst.artifactbundle/CBlst/
          bash scripts/build-linux.sh --assemble-only
      - name: Verify the bundle links and tests pass (x86_64)
        run: |
          swift build -v
          swift test -v
      - name: Commit the bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CBlst.artifactbundle
          if git diff --cached --quiet; then
            echo "No changes to the artifact bundle."
          else
            git commit -m "chore: refresh Linux CBlst.artifactbundle (x86_64 + aarch64)"
            git push origin HEAD:${{ github.ref_name }}
          fi
